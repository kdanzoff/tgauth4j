[versions]
kotlin = "2.3.21"
maven-publish = "0.37.0"  # com.vanniktech.maven.publish: Central Portal upload, signing
dokka = "2.3.0"           # Javadoc jar required by Maven Central
spring-boot = "4.1.2"   # BOM: versions of Spring Security, Spring Framework, Jackson, JUnit
kotlin-result = "2.3.1"
archunit = "1.5.1"

[libraries]
# Gradle plugins, used by build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

# BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# BOM versions
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
spring-security-config = { module = "org.springframework.security:spring-security-config" }
spring-security-web = { module = "org.springframework.security:spring-security-web" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-test = { module = "org.springframework:spring-test" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }

# Other
kotlin-result = { module = "com.michael-bull.kotlin-result:kotlin-result", version.ref = "kotlin-result" }

# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
